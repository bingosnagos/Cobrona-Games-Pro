<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Snake Pro</title>

<style>

body{
margin:0;
background:#020617;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
font-family:Arial;
color:white;
overflow:hidden;
}

h1{
color:#38bdf8;
margin:10px;
}

canvas{
background:#020617;
border:4px solid #38bdf8;
box-shadow:0 0 20px #38bdf8;
max-width:95vw;
max-height:80vh;
}

</style>

</head>

<body>

<h1>🐍 Cobrona</h1>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

let size = Math.min(window.innerWidth, window.innerHeight)*0.9
canvas.width = size
canvas.height = size

const grid = 20
let count = 0
let score = 0
let gameOver = false

let snake = {
x:200,
y:200,
dx:grid,
dy:0,
cells:[],
maxCells:4
}

let apple = {
x:160,
y:160
}

function random(min,max){
return Math.floor(Math.random()*(max-min))+min
}

function drawScore(){
ctx.fillStyle="white"
ctx.font="20px Arial"
ctx.fillText("Score: "+score,10,25)
}

function gameLoop(){

requestAnimationFrame(gameLoop)

if(gameOver) return

if(++count < 4) return

count = 0

ctx.clearRect(0,0,canvas.width,canvas.height)

snake.x += snake.dx
snake.y += snake.dy

if(
snake.x < 0 ||
snake.x >= canvas.width ||
snake.y < 0 ||
snake.y >= canvas.height
){
gameOver = true
setTimeout(()=>{
alert("Fim de jogo! Pontos: "+score)
location.reload()
},100)
}

snake.cells.unshift({x:snake.x,y:snake.y})

if(snake.cells.length > snake.maxCells){
snake.cells.pop()
}

ctx.fillStyle="#ef4444"
ctx.fillRect(apple.x,apple.y,grid-1,grid-1)

ctx.fillStyle="#22c55e"

snake.cells.forEach(function(cell,index){

ctx.fillRect(cell.x,cell.y,grid-1,grid-1)

if(cell.x === apple.x && cell.y === apple.y){

snake.maxCells++
score++

apple.x = random(0,canvas.width/grid)*grid
apple.y = random(0,canvas.height/grid)*grid

}

for(let i=index+1;i<snake.cells.length;i++){

if(cell.x === snake.cells[i].x && cell.y === snake.cells[i].y){

gameOver = true 

setTimeout(()=>{
alert("Fim de jogo! Pontos: "+score)
location.reload()
},100)

}

}

})

drawScore()

}

document.addEventListener("keydown",function(e){

if(e.key === "ArrowLeft" && snake.dx === 0){
snake.dx = -grid
snake.dy = 0
}

else if(e.key ===  "ArrowUp" && snake.dy === 0){
snake.dy = -grid
snake.dx = 0
}

else if(e.key === "ArrowRight" && snake.dx === 0){
snake.dx = grid
snake.dy = 0
}

else if(e.key === "ArrowDown" && snake.dy === 0){
snake.dy = grid
snake.dx = 0
}
})

let touchStartX = 0
let touchStartY = 0

canvas.addEventListener("touchstart",function(e){
touchStartX = e.touches[0].clientX
touchStartY = e.touches[0].clientY
})

canvas.addEventListener("touchend",function(e){

let touchEndX = e.changedTouches[0].clientX
let touchEndY = e.changedTouches[0].clientY

let dx = touchEndX - touchStartX
let dy = touchEndY - touchStartY

if(Math.abs(dx) > Math.abs(dy)){

if(dx > 0 && snake.dx === 0){
snake.dx = grid
snake.dy = 0
}

else if(dx < 0 && snake.dx === 0){
snake.dx = -grid
snake.dy = 0
}

}else{

if(dy > 0 && snake.dy === 0){
snake.dy = grid
snake.dx = 0
}

else if(dy < 0 && snake.dy === 0){
snake.dy = -grid
snake.dx = 0
}

}

})

requestAnimationFrame(gameLoop)

</script>

</body>
</html>
