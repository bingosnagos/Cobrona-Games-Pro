<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cobrona Games</title>

<style>

body{
margin:0;
background:linear-gradient(#020617,#020617,#020617,#021425);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
color:white;
overflow:hidden;
}

#gameContainer{
position:relative;
}

canvas{
background:#020617;
border:4px solid #22c55e;
box-shadow:0 0 25px #22c55e;
}

.menu{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.7);
}

button{
padding:15px 40px;
font-size:20px;
border:none;
border-radius:10px;
background:#22c55e;
color:white;
cursor:pointer;
box-shadow:0 0 10px #22c55e;
}

button:hover{
transform:scale(1.05);
}

h1{
margin-bottom:20px;
}

</style>

</head>

<body>

<div id="gameContainer">

<canvas id="game" width="600" height="600"></canvas>

<div id="startMenu" class="menu">
<h1>🐍 Cobrona Games</h1>
<button onclick="startGame()">Jogar</button>
</div>

<div id="gameOverMenu" class="menu" style="display:none">
<h1 id="gameOverText"></h1>
<button onclick="startGame()">Reiniciar</button>
</div>

</div>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

const grid = 20
let count = 0
let score = 0
let running = false

let snake
let apple

function startGame(){

document.getElementById("startMenu").style.display="none"
document.getElementById("gameOverMenu").style.display="none"

snake={
x:300,
y:300,
dx:grid,
dy:0,
cells:[],
maxCells:6
}

apple={
x:200,
y:200
}

score=0
running=true

}

function gameOver(){

running=false

document.getElementById("gameOverText").innerText=
"Acabosse oque era doce! Pontos: "+score

document.getElementById("gameOverMenu").style.display="flex"

}

function random(min,max){
return Math.floor(Math.random()*(max-min))+min
}

function drawApple(){

let pulse = Math.sin(Date.now()/200)*2

ctx.beginPath()

ctx.arc(
apple.x + grid/2,
apple.y + grid/2,
grid/2.3 + pulse,
0,
Math.PI*2
)

ctx.fillStyle="red"
ctx.fill()

}

function drawSnake(){

if(snake.cells.length < 2) return

let gradient = ctx.createLinearGradient(0,0,canvas.width,0)

gradient.addColorStop(0,"#14b8a6")
gradient.addColorStop(1,"#2dd4bf")

ctx.strokeStyle = gradient
ctx.lineWidth = grid
ctx.lineJoin = "round"
ctx.lineCap = "round"

ctx.beginPath()

snake.cells.forEach((cell,index)=>{

let x = cell.x + grid/2
let y = cell.y + grid/2

if(index === 0){
ctx.moveTo(x,y)
}else{
ctx.lineTo(x,y)
}

})

ctx.stroke()

drawHead()

}

function drawHead(){

let head = snake.cells[0]

let hx = head.x + grid/2
let hy = head.y + grid/2

ctx.fillStyle="#2dd4bf"

ctx.beginPath()
ctx.arc(hx,hy,grid/1.8,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="white"

ctx.beginPath()
ctx.arc(hx-5,hy-5,3,0,Math.PI*2)
ctx.fill()

ctx.beginPath()
ctx.arc(hx+5,hy-5,3,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="black"

ctx.beginPath()
ctx.arc(hx-5,hy-5,1.5,0,Math.PI*2)
ctx.fill()

ctx.beginPath()
ctx.arc(hx+5,hy-5,1.5,0,Math.PI*2)
ctx.fill()

}

function gameLoop(){

requestAnimationFrame(gameLoop)

if(!running) return

if(++count < 4) return
count=0

ctx.clearRect(0,0,canvas.width,canvas.height)

snake.x += snake.dx
snake.y += snake.dy

if(
snake.x < 0 ||
snake.x >= canvas.width ||
snake.y < 0 ||
snake.y >= canvas.height
){
gameOver()
return
}

snake.cells.unshift({x:snake.x,y:snake.y})

if(snake.cells.length > snake.maxCells){
snake.cells.pop()
}

drawApple()

if(snake.x === apple.x && snake.y === apple.y){

snake.maxCells++
score++

apple.x = random(0,canvas.width/grid)*grid
apple.y = random(0,canvas.height/grid)*grid

}

drawSnake()

}

document.addEventListener("keydown",function(e){

if(!running) return

if(e.key === "ArrowLeft" && snake.dx === 0){
snake.dx = -grid
snake.dy = 0
}

else if(e.key === "ArrowUp" && snake.dy === 0){
snake.dy = -grid
snake.dx = 0
}

else if(e.key === "ArrowRight" && snake.dx === 0){
snake.dx = grid
snake.dy = 0
}

else if(e.key === "ArrowDown" && snake.dy === 0){
snake.dy = grid
snake.dx = 0
}

})

let startX=0
let startY=0

canvas.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX
startY=e.touches[0].clientY
})

canvas.addEventListener("touchend",e=>{

if(!running) return

let endX=e.changedTouches[0].clientX
let endY=e.changedTouches[0].clientY

let dx=endX-startX
let dy=endY-startY

if(Math.abs(dx)>Math.abs(dy)){

if(dx>0 && snake.dx===0){
snake.dx=grid
snake.dy=0
}

else if(dx<0 && snake.dx===0){
snake.dx=-grid
snake.dy=0
}

}else{

if(dy>0 && snake.dy===0){
snake.dy=grid
snake.dx=0
}

else if(dy<0 && snake.dy===0){
snake.dy=-grid
snake.dx=0
}

}

})

requestAnimationFrame(gameLoop)

</script>

</body>
</html>
